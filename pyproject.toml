[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nepflow"
version = "0.1.0"
description = "HPC workflow system for atomistic datasets"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "ase",
    "hiphive",
    "mp-api",
    "pymatgen",
    "icet",
    "NepTrainKit",
    "scikit-learn",
    "scipy",
    "matplotlib",
]

[project.scripts]
nepflow = "nepflow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["nepflow*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["archive", "projects", "reports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["nepflow"]

[tool.ruff.format]
line-ending = "lf"
