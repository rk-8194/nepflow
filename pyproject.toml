[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nepflow"
version = "0.1.0"
description = "HPC workflow system for atomistic datasets"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "ase",
    "hiphive",
    "mp-api",
    "pymatgen",
    "icet",
    "NepTrainKit",
    "scikit-learn",
    "scipy",
    "matplotlib",
]

[project.scripts]
nepflow = "nepflow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["nepflow*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".docs", "archive", "projects", "reports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["nepflow"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
addopts = '--strict-markers -m "not external"'
markers = [
    "external: requires a live external service or executable and is excluded from ordinary CI",
    "real_generation_boundary: exercises real supercell/topology or process startup behaviour",
    "slurm: requires a live SLURM cluster",
    "vasp: requires a live VASP executable",
    "gpumd: requires a live GPUMD executable",
    "materials_project: requires a live Materials Project network request",
]
