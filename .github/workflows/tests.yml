name: Python tests

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install NEPFlow and quality tools
        run: |
          python -m pip install -e .
          python -m pip install pytest ruff pyright

      - name: Check tracked repository hygiene
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import PurePosixPath

          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"], text=False
          ).decode().split("\0")
          tracked = [path for path in tracked if path]

          prohibited = []
          generated_roots = {
              "archive",
              "build",
              "cafps",
              "dist",
              "htmlcov",
              "pairs",
              "plots",
              "projects",
              "reports",
          }
          transient_directories = {
              ".mypy_cache",
              ".nox",
              ".pytest_cache",
              ".pyright",
              ".ruff_cache",
              ".tox",
          }
          for path in tracked:
              parts = PurePosixPath(path).parts
              if "__pycache__" in parts or path.endswith((".pyc", ".pyo")):
                  prohibited.append(path)
              if (
                  parts
                  and (parts[0] in generated_roots or parts[0].startswith("run_"))
              ) or any(part in transient_directories for part in parts):
                  prohibited.append(path)
              filename = PurePosixPath(path).name.lower()
              if (
                  filename == ".coverage"
                  or filename.startswith(".coverage.")
                  or filename == "coverage.xml"
                  or filename in {".env", ".env.local", "credentials.json", "service-account.json"}
                  or filename == "potcar"
                  or filename.startswith("potcar.")
                  or filename.endswith((".err", ".log", ".out", ".p12", ".pem", ".pfx"))
              ):
                  prohibited.append(path)

          if prohibited:
              raise SystemExit(
                  "Tracked generated/local/secret artifacts found:\n"
                  + "\n".join(sorted(set(prohibited)))
              )
          PY

      - name: Check unique test basenames
        run: |
          python - <<'PY'
          from collections import defaultdict
          from pathlib import Path

          names = defaultdict(list)
          for path in Path("tests").rglob("test*.py"):
              names[path.name].append(str(path))

          duplicates = {
              name: paths
              for name, paths in names.items()
              if len(paths) > 1
          }
          if duplicates:
              raise SystemExit(
                  f"Duplicate pytest module basenames: {duplicates}"
              )
          PY

      - name: Compile package and tests
        run: python -m compileall -q src tests utilities examples

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Check Ruff lint
        run: ruff check .

      - name: Type-check package
        run: pyright

      - name: Collect tests
        run: python -m pytest --collect-only -q

      - name: Run tests
        run: python -m pytest -ra
