name: Python tests

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install NEPFlow and test runner
        run: |
          python -m pip install -e .
          python -m pip install pytest

      - name: Check unique test basenames
        run: python -c "from collections import Counter; from pathlib import Path; names = [path.name for path in Path('tests').rglob('test*.py')]; duplicates = sorted(name for name, count in Counter(names).items() if count > 1); assert not duplicates, f'Duplicate test basenames: {duplicates}'"

      - name: Compile package and tests
        run: python -m compileall -q src tests

      - name: Collect tests
        run: python -m pytest --collect-only -q

      - name: Run tests
        run: python -m pytest -ra
